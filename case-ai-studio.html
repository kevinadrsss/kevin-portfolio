<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>受保護的案例 | 陳品愷 Kevin Chen</title>
<style>
  :root {
    --bg:#0a0a0f; --bg2:#0f0f1a; --card:#12121f;
    --accent:#7c3aed; --accent2:#a855f7; --accent3:#06b6d4;
    --text:#e2e8f0; --muted:#94a3b8; --border:rgba(124,58,237,0.3);
    --fs-label:0.75rem; --fs-body:1rem; --fs-card:1.125rem; --fs-section:2rem;
    --r-sm:8px; --r-card:14px; --r-pill:999px;
    --text-2:#aab4c3; --title:#f1f5f9; --line:rgba(148,163,184,0.12); --line-hover:rgba(168,85,247,0.55);
    --mono:'Cascadia Code','Consolas',monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI','Microsoft JhengHei',sans-serif; line-height:1.7; overflow-x:hidden; }
  a { color:inherit; }
  html[lang="en"] [data-l="zh"], html:not([lang="en"]) [data-l="en"] { display:none; }

  nav {
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 64px; background:rgba(10,10,15,0.85); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .nav-logo { font-size:1.25rem; font-weight:700; color:var(--accent2); letter-spacing:0.05em; text-decoration:none; }
  .nav-right { display:flex; align-items:center; gap:24px; }
  .nav-back { color:var(--text-2); text-decoration:none; font-size:var(--fs-label); letter-spacing:0.08em; }
  .nav-back:hover { color:var(--title); }
  .lang-switch {
    display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:var(--r-pill);
    border:1px solid var(--border); background:rgba(124,58,237,0.12); color:var(--text);
    font-size:var(--fs-label); font-weight:700; letter-spacing:0.06em; cursor:pointer;
  }
  .lang-switch:hover { border-color:var(--accent2); }
  .lang-switch .muted { color:var(--muted); font-weight:600; }

  .ds-wrap { max-width:1200px; margin:0 auto; padding:0 64px; }
  .ds-eyebrow {
    display:flex; align-items:center; gap:12px; margin-bottom:16px;
    font-size:var(--fs-label); font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent3);
  }
  .ds-eyebrow::before { content:''; width:24px; height:2px; border-radius:2px; background:currentColor; flex-shrink:0; }
  .ds-icon { width:48px; height:48px; border-radius:var(--r-card); display:flex; align-items:center; justify-content:center;
    color:var(--accent2); background:rgba(124,58,237,0.12); border:1px solid rgba(124,58,237,0.28); }
  .ds-icon svg { width:24px; height:24px; }

  /* ── 解鎖畫面 ── */
  .lock { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:96px 24px 48px; }
  .lock-card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:40px 32px; }
  .lock-card .ds-icon { margin-bottom:24px; }
  .lock-title { font-size:1.5rem; line-height:1.35; font-weight:700; color:var(--title); }
  .lock-lead { font-size:var(--fs-body); color:var(--text-2); margin:16px 0 24px; line-height:1.75; }
  .lock-form { display:flex; gap:8px; }
  .lock-form input {
    flex:1; min-width:0; padding:12px 16px; border-radius:var(--r-sm); border:1px solid var(--line);
    background:var(--bg); color:var(--title); font-size:var(--fs-body); letter-spacing:0.1em;
  }
  .lock-form input:focus { outline:none; border-color:var(--accent2); }
  .lock-form button {
    padding:12px 24px; border-radius:var(--r-sm); border:none; cursor:pointer;
    background:var(--accent); color:#fff; font-weight:600; font-size:var(--fs-body);
  }
  .lock-form button:hover { background:#6d28d9; }
  .lock-form button:disabled { opacity:0.6; cursor:wait; }
  .lock-msg { min-height:24px; margin-top:12px; font-size:var(--fs-label); color:#fca5a5; letter-spacing:0.04em; }
  .lock-msg.wait { color:var(--text-2); }
  .lock-foot { margin-top:24px; font-size:var(--fs-label); }
  .lock-foot a { color:var(--text-2); text-decoration:none; }
  .lock-foot a:hover { color:var(--title); }

  /* ── 案例內容 ── */
  .cs-hero { padding:152px 0 64px; border-bottom:1px solid var(--line); }
  .cs-title { font-size:clamp(2.5rem,6vw,3.5rem); line-height:1.15; font-weight:800; color:var(--title); }
  .cs-sub { font-size:1.25rem; line-height:1.6; color:var(--text-2); margin-top:16px; max-width:760px; }
  .cs-meta { display:grid; grid-template-columns:1fr 1fr 2fr; gap:24px; margin:48px 0; }
  .cs-meta dt { font-size:var(--fs-label); font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent3); margin-bottom:8px; }
  .cs-meta dd { font-size:var(--fs-body); color:var(--text); line-height:1.7; }
  .cs-stats { display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--line); border-radius:var(--r-card); background:var(--card); }
  .cs-stats div { padding:24px; display:flex; flex-direction:column; gap:4px; }
  .cs-stats div + div { border-left:1px solid var(--line); }
  .cs-stats b { font-size:2.5rem; line-height:1.1; font-weight:700; color:var(--title); font-variant-numeric:tabular-nums; }
  .cs-stats span { font-size:var(--fs-label); color:var(--text-2); letter-spacing:0.04em; }
  .cs-note { margin-top:24px; font-size:var(--fs-label); color:var(--muted); letter-spacing:0.02em; }

  .cs-sec { padding:96px 0; }
  .cs-sec.alt { background:var(--bg2); }
  .cs-grid { display:grid; grid-template-columns:200px minmax(0,1fr); gap:48px; }
  .cs-side { position:sticky; top:172px; align-self:start; }
  .cs-num { display:block; font-size:var(--fs-label); font-weight:600; letter-spacing:0.16em; color:var(--accent2); margin-bottom:8px; }
  .cs-h2 { font-size:var(--fs-section); line-height:1.3; font-weight:700; color:var(--title); }
  .cs-body { max-width:800px; }
  .cs-h3 { font-size:1.5rem; line-height:1.4; font-weight:700; color:var(--title); margin:0 0 24px; }
  .cs-body > .cs-h3:not(:first-child) { margin-top:48px; }
  .cs-body p { font-size:var(--fs-body); color:var(--text-2); line-height:1.8; margin-bottom:16px; }
  .cs-body strong { color:var(--title); font-weight:600; }
  code { font-family:var(--mono); font-size:0.875em; padding:2px 6px; border-radius:6px; background:rgba(148,163,184,0.1); color:var(--title); }
  .cs-list { list-style:none; display:flex; flex-direction:column; gap:12px; margin:0 0 24px; }
  .cs-list li { position:relative; padding-left:20px; font-size:var(--fs-body); color:var(--text-2); line-height:1.8; }
  .cs-list li::before { content:''; position:absolute; left:0; top:0.75em; width:8px; height:2px; background:var(--accent3); }
  .cs-key { border-left:2px solid var(--accent2); padding:8px 0 8px 16px; color:var(--text) !important; }

  .cs-decision, .cs-stuck { background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:32px; margin-bottom:24px; }
  .cs-decision h4, .cs-stuck h4 { display:flex; align-items:baseline; gap:12px; font-size:var(--fs-card); line-height:1.5; font-weight:700; color:var(--title); margin-bottom:16px; }
  .cs-tag { flex-shrink:0; width:24px; height:24px; border-radius:var(--r-pill); display:inline-flex; align-items:center; justify-content:center;
    font-size:var(--fs-label); font-weight:700; color:var(--accent2); background:rgba(124,58,237,0.14); border:1px solid rgba(124,58,237,0.35); transform:translateY(-1px); }
  .cs-tag.cyan { color:var(--accent3); background:rgba(6,182,212,0.12); border-color:rgba(6,182,212,0.35); }
  .cs-decision p:last-child, .cs-stuck p:last-child { margin-bottom:0; }
  .cs-stuck dl { display:grid; grid-template-columns:120px minmax(0,1fr); gap:12px 24px; margin-bottom:16px; }
  .cs-stuck dt { font-size:var(--fs-label); font-weight:600; letter-spacing:0.1em; color:var(--accent3); padding-top:4px; }
  .cs-stuck dd { font-size:var(--fs-body); color:var(--text-2); line-height:1.75; }

  .cs-table-wrap { overflow-x:auto; margin-bottom:16px; border:1px solid var(--line); border-radius:var(--r-card); }
  .cs-table { width:100%; min-width:560px; border-collapse:collapse; }
  .cs-table th { text-align:left; font-size:var(--fs-label); font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent3); padding:16px; border-bottom:1px solid var(--line); background:var(--card); }
  .cs-table td { font-size:var(--fs-body); color:var(--text-2); line-height:1.7; padding:16px; border-bottom:1px solid var(--line); vertical-align:top; }
  .cs-table tr:last-child td { border-bottom:none; }
  .cs-table td:first-child { color:var(--title); font-weight:600; }

  /* ── 示意圖 ── */
  .cs-fig { margin:24px 0; }
  .cs-fig figcaption { margin-top:12px; font-size:var(--fs-label); color:var(--muted); letter-spacing:0.02em; }
  .cs-fig > div, .cs-fig > ol { border:1px solid var(--line); border-radius:var(--r-card); background:var(--bg); padding:24px; }
  .cs-decision .cs-fig > div { background:rgba(10,10,15,0.6); }
  .mono, .cs-fig pre { font-family:var(--mono); font-size:0.8125rem; line-height:1.7; color:var(--text-2); white-space:pre; overflow-x:auto; }

  .fig-forms { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; }
  .ff { border:1px solid var(--line); border-radius:var(--r-sm); background:var(--card); padding:12px; display:flex; flex-direction:column; gap:6px; }
  .ff:nth-child(odd) { transform:translateY(8px); }
  .ff i { font-style:normal; font-size:var(--fs-label); color:var(--muted); }
  .ff span { font-family:var(--mono); font-size:0.8125rem; color:var(--title); }
  .ff em { font-style:normal; font-family:var(--mono); font-size:var(--fs-label); color:#fca5a5; border-top:1px dashed var(--line); padding-top:6px; }

  .fig-api { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:24px; align-items:center; }
  .api-sig { background:var(--card); border:1px solid var(--line); border-radius:var(--r-sm); padding:16px; }
  .api-arrow { font-size:1.5rem; color:var(--accent3); }
  .api-form { display:flex; flex-direction:column; gap:12px; }
  .api-form label { display:grid; grid-template-columns:110px auto 1fr; align-items:center; gap:12px; font-size:var(--fs-label); color:var(--text-2); }
  .api-form small { font-family:var(--mono); font-size:var(--fs-label); color:var(--accent3); }
  .fld { font-family:var(--mono); color:var(--title); border:1px solid var(--line); border-radius:6px; padding:4px 12px; background:var(--card); }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg b, .seg i { font-style:normal; font-weight:600; font-size:var(--fs-label); padding:4px 8px; color:var(--text-2); }
  .seg b { background:var(--accent); color:#fff; }
  .tgl { width:32px; height:18px; border-radius:var(--r-pill); background:rgba(148,163,184,0.25); position:relative; }
  .tgl::after { content:''; position:absolute; top:3px; left:3px; width:12px; height:12px; border-radius:50%; background:var(--title); }

  .fig-nav { display:flex; flex-direction:column; gap:16px; }
  .nav-row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .nav-row small { width:72px; font-size:var(--fs-label); letter-spacing:0.1em; color:var(--muted); }
  .nav-row b { font-weight:600; font-size:0.875rem; padding:6px 14px; border-radius:var(--r-pill); border:1px solid var(--line); color:var(--text-2); }
  .nav-row b.on { background:rgba(124,58,237,0.18); border-color:var(--line-hover); color:var(--title); }
  .nav-row + .nav-row b.on { background:rgba(6,182,212,0.14); border-color:rgba(6,182,212,0.5); }
  .nav-adv { font-size:var(--fs-label); color:var(--muted); padding-left:80px; }

  .fig-status { display:flex; flex-direction:column; gap:12px; }
  .st { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:12px 16px; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--card); font-size:0.875rem; color:var(--title); }
  .st small { margin-left:auto; font-size:var(--fs-label); color:var(--muted); }
  .st.bad code { color:#fca5a5; background:none; padding:0; }
  .dot { width:10px; height:10px; border-radius:50%; }
  .dot.red { background:#ef4444; }
  .btn-mini { font-size:var(--fs-label); font-weight:600; padding:4px 12px; border-radius:6px; background:var(--accent); color:#fff; }

  .fig-files { display:flex; flex-direction:column; gap:8px; }
  .fl { display:flex; align-items:center; gap:12px; font-family:var(--mono); font-size:0.8125rem; color:var(--title); }
  .fl .ico { width:32px; height:24px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; font-size:var(--fs-label); background:rgba(124,58,237,0.16); color:var(--accent2); }
  .fl.json .ico { background:rgba(6,182,212,0.14); color:var(--accent3); }
  .json-peek { margin:4px 0 0 44px; padding:12px 16px; border-left:2px solid var(--accent3); background:var(--card); border-radius:0 var(--r-sm) var(--r-sm) 0; }

  .fig-shots { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; }
  .fig-shots small { display:block; font-size:var(--fs-label); letter-spacing:0.1em; color:var(--muted); margin-bottom:12px; }
  .shots-before pre { color:#fca5a5; }
  .shot { display:grid; grid-template-columns:24px 1fr 40px 72px; align-items:center; gap:12px; margin-bottom:8px; font-size:var(--fs-label); }
  .shot b { color:var(--accent2); }
  .shot .bar { height:8px; border-radius:var(--r-pill); background:linear-gradient(90deg, rgba(6,182,212,0.6) var(--w), rgba(148,163,184,0.15) var(--w)); }
  .shot em { font-style:normal; color:var(--title); font-family:var(--mono); }
  .shot i { font-style:normal; color:var(--text-2); font-family:var(--mono); text-align:right; }
  .shot-sum { margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); font-size:var(--fs-label); color:#86efac; font-weight:600; }

  .fig-flow { list-style:none; display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .fig-flow li { font-size:0.875rem; font-weight:600; color:var(--title); padding:8px 16px; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--card); }
  .fig-flow { gap:32px; }
  .fig-flow li { position:relative; }
  .fig-flow li:not(:last-child)::after { content:'→'; position:absolute; right:-24px; top:50%; transform:translateY(-50%); color:var(--accent3); font-weight:400; }
  .fig-flow li.hl { border-color:var(--line-hover); background:rgba(124,58,237,0.16); }
  .fig-flow li.wip { border:1px dashed rgba(148,163,184,0.45); color:var(--text-2); background:transparent; }
  .cs-table col.c-a { width:28%; } .cs-table col.c-b { width:24%; } .cs-table col.c-k { width:22%; } .cs-table col.c-h { width:39%; }

  /* ── 介紹＋多案例：目錄與分部標頭 ── */
  .cs-byline { margin-top:24px; font-size:var(--fs-body); color:var(--text); letter-spacing:0.02em; }
  .cs-toc { position:sticky; top:61px; z-index:90; background:rgba(10,10,15,0.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  .cs-toc .ds-wrap { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding-top:8px; padding-bottom:8px; }
  .cs-toc .ds-wrap::-webkit-scrollbar { display:none; }
  .cs-toc a { flex-shrink:0; padding:6px 14px; border-radius:var(--r-pill); font-size:0.875rem; font-weight:600; color:var(--text-2); text-decoration:none; border:1px solid transparent; white-space:nowrap; }
  .cs-toc a:hover { color:var(--title); }
  .cs-toc a.on { color:var(--title); background:rgba(124,58,237,0.18); border-color:var(--line-hover); }
  #case [id] { scroll-margin-top:148px; }
  .part-head { padding:112px 0 48px; border-top:1px solid var(--line); background:linear-gradient(180deg, rgba(124,58,237,0.08), transparent 70%); }
  .part-title { font-size:clamp(1.75rem,4vw,2.5rem); line-height:1.3; font-weight:800; color:var(--title); max-width:900px; }
  .part-title .ph, .sl-title .ph { display:inline-block; text-wrap:balance; }
  .part-lead { margin-top:16px; font-size:var(--fs-card); line-height:1.75; color:var(--text-2); max-width:800px; }
  .part-head .cs-meta { margin:40px 0 32px; }
  .part-head + .cs-sec { padding-top:48px; }

  .stage-row { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
  .stage { background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:24px; display:flex; flex-direction:column; gap:8px; }
  .stage small { font-size:var(--fs-label); font-weight:600; letter-spacing:0.14em; color:var(--muted); }
  .stage b { font-size:var(--fs-card); color:var(--title); }
  .cs-body .stage p { margin:0; font-size:0.9375rem; }
  .stage.now { border-color:var(--line-hover); background:linear-gradient(160deg, rgba(124,58,237,0.18), var(--card) 70%); }
  .stage.now small { color:var(--accent3); }
  .cs-body .cs-quote { font-size:1.5rem; line-height:1.6; font-weight:700; color:var(--title); padding:8px 0 8px 24px; border-left:3px solid var(--accent3); margin-bottom:24px; }

  .journey, .steps3, .five { list-style:none; display:grid; gap:12px; margin:0 0 24px; }
  .journey { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .journey li, .steps3 li, .five li { background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:16px 20px; display:flex; flex-direction:column; gap:4px; font-size:0.875rem; color:var(--text-2); line-height:1.6; }
  .journey small, .steps3 small, .five small { font-size:var(--fs-label); font-weight:600; letter-spacing:0.12em; color:var(--accent2); }
  .journey b, .steps3 b, .five b { font-size:var(--fs-body); color:var(--title); }
  .steps3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .steps3 li:last-child { border-color:var(--line-hover); }
  .steps3 code { align-self:flex-start; font-size:0.75rem; white-space:nowrap; max-width:100%; overflow-x:auto; }
  .five { grid-template-columns:repeat(5,minmax(0,1fr)); }
  .five em { font-style:normal; margin-top:auto; padding-top:8px; border-top:1px dashed var(--line); font-size:var(--fs-label); color:var(--accent3); }

  .fig-wb { display:grid; grid-template-columns:220px minmax(0,1fr); gap:0; padding:0 !important; overflow:hidden; }
  .wb-side { display:flex; flex-direction:column; gap:4px; padding:16px; border-right:1px solid var(--line); background:var(--card); }
  .wb-side small { font-size:var(--fs-label); letter-spacing:0.1em; color:var(--muted); margin:8px 0 4px; }
  .wb-side small:first-child { margin-top:0; }
  .wb-side > span { display:flex; align-items:center; gap:8px; font-size:0.8125rem; color:var(--text-2); padding:6px 8px; border-radius:6px; }
  .wb-side > span.on { background:rgba(124,58,237,0.18); color:var(--title); }
  .wb-main { display:flex; align-items:center; justify-content:center; text-align:center; padding:32px; font-size:0.875rem; color:var(--muted); line-height:1.8;
    background:repeating-linear-gradient(135deg, transparent 0 12px, rgba(148,163,184,0.04) 12px 24px); }
  .dot.ok { background:#22c55e; } .dot.warn { background:#f59e0b; }
  .dot { flex-shrink:0; display:inline-block; }

  .growth { list-style:none; display:flex; align-items:flex-end; gap:16px; height:200px; }
  .growth li { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%; }
  .growth b { font-size:var(--fs-body); color:var(--title); }
  .growth li::before { content:''; order:1; width:100%; max-width:56px; height:calc(var(--n) / 13 * 120px); border-radius:6px 6px 0 0; background:linear-gradient(180deg, var(--accent2), rgba(124,58,237,0.35)); }
  .growth li:last-child::before { background:linear-gradient(180deg, var(--accent3), rgba(6,182,212,0.35)); }
  .growth small { order:2; font-size:var(--fs-label); color:var(--muted); }

  .fig-script { display:flex; flex-direction:column; gap:8px; }
  .fig-script small { font-size:var(--fs-label); letter-spacing:0.1em; color:var(--muted); margin-bottom:4px; }

<script>
(function () {
  const T = {
    back: ['← 回作品集', '← Back to portfolio'],
    title: ['這個案例需要密碼', 'This case study is password-protected'],
    lead: ['這是面試用的介紹與 UI/UX 案例。內容是加密存放的，輸入密碼後才會在你的瀏覽器裡解開。', 'This introduction and set of UI/UX case studies is shared for interviews. The content is stored encrypted and is only decrypted in your browser after you enter the password.'],
    ph: ['密碼', 'Password'],
    unlock: ['解鎖', 'Unlock'],
    wait: ['解鎖中…', 'Unlocking…'],
    wrong: ['密碼不對，再試一次。', 'Wrong password. Please try again.'],
    nocrypto: ['這個瀏覽器不支援解密，請改用最新版 Chrome、Edge 或 Safari。', 'This browser cannot decrypt the page. Please use a current version of Chrome, Edge or Safari.'],
    footer: ['© 2026 陳品愷 Kevin Chen · All Rights Reserved', '© 2026 Kevin Chen · All Rights Reserved'],
    doctitle: ['受保護的案例 | 陳品愷 Kevin Chen', 'Protected case study | Kevin Chen'],
    present: ['簡報模式', 'Present'],
    help: ['← → 翻頁　N 講稿　F 全螢幕　Esc 離開', '← → slides　N notes　F fullscreen　Esc exit'],
    doctitleOpen: ['介紹與 UI/UX 案例 | 陳品愷 Kevin Chen', 'Introduction & UI/UX case studies | Kevin Chen']
  };
  let lang = 'zh';
  let unlocked = false;
  const t = k => T[k][lang === 'en' ? 1 : 0];

  function readLang() { try { return localStorage.getItem('portfolioLang'); } catch (e) { return null; } }
  function saveLang(v) { try { localStorage.setItem('portfolioLang', v); } catch (e) {} }

  function setLanguage(v) {
    lang = v === 'en' ? 'en' : 'zh';
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-TW';
    document.querySelectorAll('[data-i18n]').forEach(el => { if (T[el.dataset.i18n]) el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    document.querySelector('[data-lang-current]').textContent = lang === 'en' ? 'EN' : '中';
    document.querySelector('[data-lang-next]').textContent = lang === 'en' ? '中' : 'EN';
    document.title = t(unlocked ? 'doctitleOpen' : 'doctitle');
    saveLang(lang);
  }

  document.getElementById('lang-toggle').addEventListener('click', () => setLanguage(lang === 'en' ? 'zh' : 'en'));
  const urlLang = new URLSearchParams(location.search).get('lang');
  setLanguage(urlLang === 'en' ? 'en' : (readLang() || 'zh'));

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function decrypt(pw) {
    const p = JSON.parse(document.getElementById('payload').textContent);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(p.salt), iterations: p.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(p.iv) }, key, b64(p.ct));
    return new TextDecoder().decode(plain);
  }

  // 解鎖後：影片捲進畫面才播、目錄跟著目前段落亮起（innerHTML 裡的 script 不會執行，所以放這裡）
  function enhance(box) {
    box.querySelectorAll('.cs-shot img').forEach(img => img.addEventListener('click', () => {
      const z = document.createElement('div');
      z.className = 'zoom';
      z.innerHTML = '<img alt="">';
      z.firstChild.src = img.src;
      const close = () => { z.remove(); removeEventListener('keydown', onKey); };
      const onKey = e => { if (e.key === 'Escape') close(); };
      z.addEventListener('click', close);
      addEventListener('keydown', onKey);
      document.body.append(z);
    }));
    if (!('IntersectionObserver' in window)) return;
    const vio = new IntersectionObserver(entries => entries.forEach(e => {
      const v = e.target;
      if (e.isIntersecting) { const p = v.play(); if (p && p.catch) p.catch(() => {}); } else { v.pause(); }
    }), { threshold: 0.35 });
    box.querySelectorAll('video[data-auto]').forEach(v => vio.observe(v));

    const links = [...box.querySelectorAll('.cs-toc a[href^="#"]')];
    const secs = links.map(a => [a, document.getElementById(a.getAttribute('href').slice(1))]).filter(x => x[1]);
    let cur = null, ticking = false;
    function sync() {
      ticking = false;
      let hit = secs[0];
      for (const s of secs) { if (s[1].getBoundingClientRect().top <= 200) hit = s; }
      if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) hit = secs[secs.length - 1];
      if (!hit || hit[0] === cur) return;
      if (cur) cur.classList.remove('on');
      cur = hit[0]; cur.classList.add('on');
      const c = cur.parentElement;  // 只捲目錄本身，不動整頁
      if (c.scrollWidth > c.clientWidth) c.scrollTo({ left: cur.offsetLeft - c.offsetLeft - c.clientWidth / 2 + cur.offsetWidth / 2 });
    }
    addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(sync); } }, { passive: true });
    sync();
  }

  // ── 簡報模式：同一份內容，P 進入、方向鍵/簡報器翻頁、N 講稿（只在你按的時候出現）──
  const deck = { slides: [], i: 0, t0: 0, s0: 0, tick: null, target: 0 };
  const $ = id => document.getElementById(id);
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

  function buildDeck(box) {
    const d = box.querySelector('#deck');
    if (!d) return;
    d.querySelectorAll('[data-clone]').forEach(h => {
      const src = [...box.querySelectorAll(h.dataset.clone)].filter(el => !el.closest('#deck'))[+(h.dataset.n || 0)];
      if (!src) return;
      const node = (h.dataset.up ? src.closest(h.dataset.up) : src).cloneNode(true);
      node.querySelectorAll('figcaption').forEach(f => f.remove());
      if (h.dataset.max) [...node.children].slice(+h.dataset.max).forEach(c => c.remove());
      [node, ...node.querySelectorAll('[id]')].forEach(e => e.removeAttribute('id'));
      node.querySelectorAll('video').forEach(v => { v.removeAttribute('data-auto'); v.preload = 'metadata'; });
      if (node.tagName === 'IMG') node.removeAttribute('loading');
      h.append(node);
    });
    deck.slides = [...d.querySelectorAll('.slide')];
    deck.target = deck.slides.reduce((a, s) => a + (+s.dataset.t || 0), 0);
    $('deck-total').textContent = deck.slides.length;
    $('present-btn').hidden = false;
    $('present-btn').addEventListener('click', enterPresent);
    $('deck-exit').addEventListener('click', exitPresent);
    d.addEventListener('click', e => { if (!e.target.closest('video, a, button')) go(deck.i + 1); });
    const m = /^#s(\d+)$/.exec(location.hash);
    if (m) deck.i = +m[1] - 1;
  }

  function clock() {
    const now = Date.now(), s = deck.slides[deck.i];
    const per = (now - deck.s0) / 1000, all = (now - deck.t0) / 1000, want = +s.dataset.t || 0;
    $('deck-clock').innerHTML = `本頁 <span class="${per > want ? 'over' : ''}">${fmt(per)}</span> / 建議 ${fmt(want)}　·　總計 <span class="${all > deck.target ? 'over' : ''}">${fmt(all)}</span> / 目標 ${fmt(deck.target)}　·　R 重新計時`;
  }

  function go(i) {
    if (!deck.slides.length) return;
    i = Math.max(0, Math.min(deck.slides.length - 1, i));
    deck.slides.forEach((s, k) => {
      const on = k === i;
      s.classList.toggle('on', on);
      s.querySelectorAll('video').forEach(v => {
        if (on) { v.currentTime = 0; const p = v.play(); if (p && p.catch) p.catch(() => {}); } else { v.pause(); }
      });
    });
    if (i !== deck.i || !deck.s0) deck.s0 = Date.now();
    deck.i = i;
    $('deck-n').textContent = i + 1;
    $('deck-prog').style.setProperty('--p', ((i + 1) / deck.slides.length * 100) + '%');
    const note = deck.slides[i].querySelector('.note');
    $('deck-note').textContent = note ? note.textContent.trim() : '';
    history.replaceState(null, '', location.pathname + location.search + '#s' + (i + 1));
    clock();
  }

  function fitDeck() { document.documentElement.style.setProperty('--dz', Math.min(1.7, Math.max(1, innerWidth / 1180)).toFixed(3)); }
  addEventListener('resize', fitDeck);

  function enterPresent() {
    fitDeck();
    if (!deck.slides.length) return;
    document.querySelectorAll('#case video').forEach(v => { if (!v.closest('#deck')) v.pause(); });
    document.body.classList.add('present');
    if (!deck.t0) deck.t0 = Date.now();
    deck.s0 = 0;
    go(deck.i);
    clearInterval(deck.tick);
    deck.tick = setInterval(clock, 1000);
  }

  function exitPresent() {
    document.body.classList.remove('present', 'notes');
    clearInterval(deck.tick);
    deck.slides.forEach(s => s.querySelectorAll('video').forEach(v => v.pause()));
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    history.replaceState(null, '', location.pathname + location.search);
  }

  addEventListener('keydown', e => {
    if (!unlocked || e.ctrlKey || e.metaKey || e.altKey || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (document.querySelector('.zoom')) return;
    const k = e.key;
    if (!document.body.classList.contains('present')) {
      if (k === 'p' || k === 'P') { e.preventDefault(); enterPresent(); }
      return;
    }
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); go(deck.i + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); go(deck.i - 1); }
    else if (k === 'Home') go(0);
    else if (k === 'End') go(deck.slides.length - 1);
    else if (k === 'n' || k === 'N') document.body.classList.toggle('notes');
    else if (k === 'r' || k === 'R') { deck.t0 = deck.s0 = Date.now(); clock(); }
    else if (k === 'l' || k === 'L') setLanguage(lang === 'en' ? 'zh' : 'en');
    else if (k === 'f' || k === 'F') {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else document.documentElement.requestFullscreen().catch(() => {});
    }
    else if (k === 'Escape' || k === 'p' || k === 'P') exitPresent();
  });

  const form = document.getElementById('lock-form');
  const msg = document.getElementById('lock-msg');
  const btn = document.getElementById('unlock-btn');
  const input = document.getElementById('pw');

  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    if (!window.crypto || !crypto.subtle) { msg.className = 'lock-msg'; msg.textContent = t('nocrypto'); return; }
    btn.disabled = true; msg.className = 'lock-msg wait'; msg.textContent = t('wait');
    try {
      const html = await decrypt(input.value);
      const box = document.getElementById('case');
      box.innerHTML = html;
      box.hidden = false;
      document.getElementById('lock').remove();
      unlocked = true;
      setLanguage(lang);
      window.scrollTo(0, 0);
      enhance(box);
      buildDeck(box);
      if (new URLSearchParams(location.search).has('present') || /^#s\d+$/.test(location.hash)) enterPresent();
    } catch (e) {
      msg.className = 'lock-msg'; msg.textContent = t('wrong');
      input.select();
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
